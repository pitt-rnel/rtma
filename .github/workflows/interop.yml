name: Interop tests

# Builds rtma and runs every test, CTest and pytest, with pyrtma, against
# pyrtma's message manager and the C++ one, on each platform. The interop
# tests start many processes and take a few minutes, so this runs only when
# started by hand: Actions > Interop tests > Run workflow. The MATLAB tests
# need MATLAB, and are skipped.
on:
  workflow_dispatch:
    inputs:
      pyrtma_ref:
        description: "pyrtma branch, tag or commit to test with"
        required: true
        default: "v4"

jobs:
  interop:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Check out pyrtma
        uses: actions/checkout@v4
        with:
          repository: pitt-rnel/pyrtma
          ref: ${{ inputs.pyrtma_ref }}
          # Not ./pyrtma, which Python could find as a package from the
          # repository root.
          path: build/pyrtma-src

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pyrtma and pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./build/pyrtma-src "pytest>=8.4" pytest-timeout

      - name: Configure
        run: cmake -S . -B build/cmake -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build/cmake --config Release --parallel

      - name: CTest
        run: ctest --test-dir build/cmake -C Release --output-on-failure

      - name: pytest
        run: python -m pytest tests -rfExX --timeout 300
